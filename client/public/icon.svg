<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Wallet Body -->
  <rect x="96" y="144" width="320" height="230" rx="32" fill="#1e1b4b" opacity="0.9" />
  <!-- Wallet Flap -->
  <path d="M 96 176 C 96 150, 116 136, 140 136 L 372 136 C 396 136, 416 150, 416 176 L 416 230 L 96 230 Z" fill="#312e81" />
  <!-- Coin Icon -->
  <circle cx="256" cy="270" r="56" fill="url(#coin)" stroke="#d97706" stroke-width="4" />
  <!-- Rupee Symbol on Coin -->
  <text x="256" y="292" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#78350f" text-anchor="middle">₹</text>
  <!-- Sparkles -->
  <circle cx="380" cy="120" r="12" fill="#fef08a" />
  <circle cx="120" cy="380" r="8" fill="#a5b4fc" />
</svg>
